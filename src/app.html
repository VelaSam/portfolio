<!doctype html>
<html lang="en" class="fonts-loading">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
		<link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
		<link rel="icon" href="/favicon.ico" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />

		<!-- Open Graph / Social Link Preview Meta Tags -->
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="Samuel Velasco" />
		<meta property="og:url" content="https://samuelvelasco.dev/" />
		<meta property="og:title" content="Samuel Velasco — Software Developer" />
		<meta
			property="og:description"
			content="Software Developer (B.Eng. Software Engineering, ÉTS Montréal) — Fullstack applications, clean backend architectures, and systems from the metal up."
		/>
		<meta property="og:image" content="https://samuelvelasco.dev/og-preview.png?v=2" />
		<meta property="og:image:type" content="image/png" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta property="og:image:alt" content="Samuel Velasco — Software Developer (B.Eng. Software Engineering, ÉTS Montréal)" />

		<!-- Twitter / X Card Meta Tags -->
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="Samuel Velasco — Software Developer" />
		<meta
			name="twitter:description"
			content="Software Developer (B.Eng. Software Engineering, ÉTS Montréal) — Fullstack applications, clean backend architectures, and systems from the metal up."
		/>
		<meta name="twitter:image" content="https://samuelvelasco.dev/og-preview.png?v=2" />
		<meta name="theme-color" content="#faf6f0" />

		<!-- Preconnect & load fonts before body to prevent FOUT/FOIT -->
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
		<link
			href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500&display=block"
			rel="stylesheet"
		/>

		<!-- Critical inline styles to prevent FOUC before Vite/SvelteKit CSS loads -->
		<style>
			:root {
				--bg-canvas: #faf6f0;
				--text-primary: #1c1917;
			}
			html,
			body {
				margin: 0;
				padding: 0;
				background-color: #faf6f0;
				color: #1c1917;
				font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
				-webkit-font-smoothing: antialiased;
			}
			html[data-theme='dark'],
			html[data-theme='dark'] body {
				background-color: #141210;
				color: #f4efe6;
			}
			html.fonts-loading .site-container {
				opacity: 0;
			}
			.site-container {
				opacity: 1;
				transition: opacity 0.18s ease-out;
			}
		</style>

		<script>
			(function () {
				try {
					var t = localStorage.getItem('samuel_portfolio_theme');
					if (t === 'dark' || t === 'light') {
						document.documentElement.dataset.theme = t;
					}
				} catch (e) {}
				var done = function () {
					document.documentElement.classList.remove('fonts-loading');
				};
				var timer = setTimeout(done, 220);
				if (document.fonts && document.fonts.ready) {
					document.fonts.ready.then(function () {
						clearTimeout(timer);
						done();
					});
				} else {
					done();
				}
			})();
		</script>

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
