<!doctype html>
<html lang="en" class="fonts-loading">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
		<link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
		<link rel="icon" href="/favicon.ico" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />

		<!-- Preconnect & load fonts before body to prevent FOUT/FOIT -->
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
		<link
			href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500&display=block"
			rel="stylesheet"
		/>

		<!-- Critical inline styles to prevent FOUC before Vite/SvelteKit CSS loads -->
		<style>
			:root {
				--bg-canvas: #faf6f0;
				--text-primary: #1c1917;
			}
			html,
			body {
				margin: 0;
				padding: 0;
				background-color: #faf6f0;
				color: #1c1917;
				font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
				-webkit-font-smoothing: antialiased;
			}
			html.fonts-loading .site-container {
				opacity: 0;
			}
			.site-container {
				opacity: 1;
				transition: opacity 0.18s ease-out;
			}
		</style>

		<script>
			(function () {
				var done = function () {
					document.documentElement.classList.remove('fonts-loading');
				};
				var timer = setTimeout(done, 220);
				if (document.fonts && document.fonts.ready) {
					document.fonts.ready.then(function () {
						clearTimeout(timer);
						done();
					});
				} else {
					done();
				}
			})();
		</script>

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
